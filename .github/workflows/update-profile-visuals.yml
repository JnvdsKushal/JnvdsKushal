name: Update Profile Visuals

on:
  schedule:
    - cron: "30 0 * * *"   # runs once a day at 00:30 UTC
  workflow_dispatch: {}     # allows manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Switch to output branch (create it if it doesn't exist yet)
        run: |
          git fetch origin output 2>/dev/null || true
          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
          fi

      - name: Place freshly generated snake SVG
        run: |
          if [ -f dist/github-contribution-grid-snake.svg ]; then
            cp dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          fi

      - name: Fetch stats cards (keeps the previous file if a fetch fails)
        run: |
          fetch() {
            url="$1"
            out="$2"
            tmp="$(mktemp)"
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 25 "$url" -o "$tmp" && grep -q "<svg" "$tmp"; then
              mv "$tmp" "$out"
              echo "updated $out"
            else
              echo "fetch failed for $out — keeping existing version"
              rm -f "$tmp"
            fi
          }

          OWNER="${{ github.repository_owner }}"

          fetch "https://github-readme-stats.vercel.app/api?username=${OWNER}&show_icons=true&theme=default&bg_color=FFFFFF&title_color=6366F1&icon_color=8B5CF6&text_color=24292E&border_color=E4E2E2&border_radius=10&count_private=false" stats-card.svg
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=${OWNER}&layout=compact&theme=default&bg_color=FFFFFF&title_color=6366F1&text_color=24292E&border_color=E4E2E2&border_radius=10&langs_count=8" top-langs.svg
          fetch "https://streak-stats.demolab.com/?user=${OWNER}&theme=default&background=FFFFFF&ring=6366F1&fire=8B5CF6&currStreakLabel=6366F1&sideLabels=24292E&currStreakNum=24292E&sideNums=24292E&dates=6B7280&border=E4E2E2&border_radius=10" streak-stats.svg

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg stats-card.svg top-langs.svg streak-stats.svg
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile visuals"
            git push origin output
          fi